name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Theme contrast check
        run: npm run audit-contrast:check

      - name: Unit tests
        run: npm test

      - name: Install theme render browser
        run: npx playwright install --with-deps chromium

      - name: Theme renderer integration test
        run: npm run test:theme-renderer

      - name: Design compliance
        run: npm run audit:design:check

      - name: Design compliance (changed files, strict)
        if: github.event_name == 'pull_request'
        run: npm run audit:ui:changed -- --check --strict --base=origin/${{ github.base_ref }}

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run budget

      - name: UI interaction regression
        run: |
          npm run dev -- --host 127.0.0.1 --port 4322 &
          dev_pid=$!
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4322/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4322/ || { kill "$dev_pid" 2>/dev/null || true; exit 1; }
          UI_TEST_URL=http://127.0.0.1:4322 npm run test:ui
          kill "$dev_pid" 2>/dev/null || true
