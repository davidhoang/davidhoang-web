name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Theme contrast check
        run: npm run audit-contrast:check

      - name: Unit tests
        run: npm test

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install theme render browser
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            timeout 15m npx playwright install chromium
          else
            timeout 30m npx playwright install --with-deps chromium
          fi

      - name: Theme renderer integration test
        run: npm run test:theme-renderer

      - name: Design compliance
        run: npm run audit:design:check

      - name: Design compliance (changed files, strict)
        if: github.event_name == 'pull_request'
        run: npm run audit:ui:changed -- --check --strict --base=origin/${{ github.base_ref }}

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run budget

      - name: UI interaction regression
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4322 &
          dev_pid=$!
          cleanup() { kill "$dev_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 120); do
            if curl -sf http://127.0.0.1:4322/ -o /dev/null && curl -sf http://127.0.0.1:4322/notes -o /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Dev server did not become ready on :4322"
            exit 1
          fi
          timeout 45m env UI_TEST_URL=http://127.0.0.1:4322 npm run test:ui

  design-strict-report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict design compliance (report only)
        run: npm run audit:design:strict
